<div class="modal fade" #promptModal tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header border-0 pb-0 pt-4 px-4 d-flex justify-content-center">
        <div class="rounded-circle bg-opacity-10 d-flex align-items-center justify-content-center"
          [ngClass]="'bg-' + opciones.tipo" style="width: 70px; height: 70px;">
          <i class="bi fs-2" [ngClass]="obtenerIcono()"></i>
        </div>
      </div>
      <div class="modal-body text-center p-4">
        <h4 class="fw-bold mb-2 text-body-emphasis">{{ opciones.titulo }}</h4>
        <p class="text-secondary mb-3">{{ opciones.mensaje }}</p>

        <div class="text-start position-relative">
          <input type="text" class="form-control form-control-lg rounded-3 border-2 shadow-sm pe-5" [(ngModel)]="valorIngresado"
            [placeholder]="opciones.placeholder || ''" [maxlength]="opciones.maxLength || 524288" (keyup.enter)="alConfirmar()" #campoEntrada>
          <span class="position-absolute end-0 bottom-0 mb-3 me-3 small badge bg-light text-secondary border fw-medium rounded-pill shadow-sm" 
            *ngIf="opciones.maxLength" style="transform: translateY(2px);">
            {{ valorIngresado.length }}/{{ opciones.maxLength }}
          </span>
        </div>
      </div>
      <div class="modal-footer border-0 p-4 pt-0 d-flex gap-2">
        <button type="button" class="btn btn-danger flex-fill rounded-pill py-2 fw-medium" (click)="alCancelar()">
          {{ opciones.textoCancelar || 'Cancelar' }}
        </button>
        <button type="button" class="btn flex-fill rounded-pill py-2 fw-bold shadow-sm" [ngClass]="'btn-' + opciones.tipo"
          [disabled]="!valorIngresado.trim()" (click)="alConfirmar()">
          {{ opciones.textoConfirmar || 'Aceptar' }}
        </button>
      </div>
    </div>
  </div>
</div>
